# Secbian USBGuard baseline policy
#
# Allow USB HID devices (keyboards, mice, tablets) so the machine stays usable
# out of the box, and block everything else by default (mass storage, network
# adapters, evil-maid gadgets, ...).
#
# Approve a device at runtime with:
#   usbguard list-devices
#   sudo usbguard allow-device <id>
#
# List new blocked devices with: usbguard list-devices --blocked

allow with-interface match-all { 03:00:00 03:00:01 03:00:02 03:01:01 03:01:02 }
block

# Preserve the boot drive, hubs, and input devices already authorized at startup.
# keep also preserves blocked states across a daemon restart (allow would not).
RuleFile=/etc/usbguard/rules.conf
ImplicitPolicyTarget=block
PresentDevicePolicy=keep
PresentControllerPolicy=keep
InsertedDevicePolicy=block
AuthorizedDefault=none
RestoreControllerDeviceState=false
# Ignore package-generated rules.d and group ACLs; approval uses sudo explicitly.
IPCAllowedUsers=root
DeviceManagerBackend=uevent
DeviceRulesWithPort=true
AuditBackend=FileAudit
AuditFilePath=/var/log/usbguard/usbguard-audit.log
HidePII=true

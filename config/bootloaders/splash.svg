<svg xmlns="http://www.w3.org/2000/svg"
     width="640" height="480" viewBox="0 0 640 480">
  <title>Secbian Live boot background</title>

  <rect width="640" height="480" fill="#080d17"/>
  <path d="M0 208H640 M0 442H640" stroke="#1a2a3d"/>

  <!-- Terminal brackets and a rounded S. -->
  <g transform="translate(43 35)" fill="#52e0c4">
    <path d="M37 22H19V106H37 M91 22H109V106H91"
          fill="none"
          stroke="#52e0c4"
